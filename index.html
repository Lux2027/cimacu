<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a4a">
<title>Cimacu</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="lvlbox">
    <div id="lvlrow"><span id="title">CIMACU</span><span id="lvl">Lv 1</span></div>
    <div id="xpbar"><div id="xpfill"></div></div>
  </div>
  <button id="bag" aria-label="Rucksack öffnen">🎒</button>
</div>
<div id="hint">Links ziehen = laufen · Rechts wischen = Kamera</div>

<div id="stick"><div id="knob"></div></div>

<div id="hotbar"></div>
<button id="act"><span id="actIcon">✋</span><span id="actLabel">—</span><svg id="actRing" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg></button>

<div id="toast"></div>
<div id="levelup"><div id="lvTitle">LEVEL UP!</div><div id="lvNum">2</div><div id="lvSub">Du baust jetzt schneller ab</div></div>

<div id="inv" hidden>
  <div id="sheet">
    <div id="sheetHead"><b>Rucksack</b><button id="close" aria-label="Schließen">✕</button></div>
    <div id="tabs">
      <button data-tab="items" class="on">Rohstoffe</button>
      <button data-tab="tools">Werkzeuge</button>
      <button data-tab="craft">Herstellen</button>
      <button data-tab="ach">Erfolge</button>
    </div>
    <div id="tabBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.js"></script>
<script src="game.js?v=2"></script>
</body>
</html>
