<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a4a">
<title>Cimacu</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a4a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; color: #fff; }
  #title { font-weight: 800; font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  #step { font-size: 12px; background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 20px; }
  #hint { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.85); font-size: 13px; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.6); transition: opacity 1s; }
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.35); pointer-events: none; left: 90px; bottom: 0; top: auto; opacity: .5; transition: opacity .2s; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="title">CIMACU</div><div id="step">Schritt 1 · Bewegung</div></div>
<div id="stick"><div id="knob"></div></div>
<div id="hint">Links ziehen = laufen · Rechts wischen = Kamera drehen</div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.js"></script>
<script src="game.js"></script>
</body>
</html>
